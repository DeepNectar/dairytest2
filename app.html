<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- App launcher for Dairy Writing.
       This page does ONE thing: it opens the CURRENT index.html application in
       a dedicated, app-like window (standalone frame — no browser chrome) on
       every device. It contains NO copy of the journal logic: all markup,
       styling and behaviour come from the untouched index.html / style.css /
       script.js, so the app is always identical to the current code for all
      devices (desktop, tablet, phone). -->
  <script>
    // ---- Shared launch logic (used by auto-open AND the fallback button) ----
    var APP_TARGET = "index.html?mode=app";
    function isSmallTouch() {
      // Phone/tablet: coarse pointer or a narrow viewport.
      return (window.matchMedia &&
              (matchMedia("(pointer: coarse)").matches || matchMedia("(max-width: 900px)").matches)) ||
             ("ontouchstart" in window && innerWidth <= 1100);
    }
    function isAndroidPhone() {
      return /Android/i.test(navigator.userAgent || "") && isSmallTouch();
    }
    function isStandalone() {
      return !!(window.matchMedia && matchMedia("(display-mode: standalone)").matches);
    }
    function openAppWindow() {
      if (isAndroidPhone()) {
        // Chrome/Edge on Android: this tab itself becomes the app view of the
        // exact same current code (index.html) — no separate window needed.
        location.replace(APP_TARGET);
        return true;
      }
      // Desktop browsers & iOS Safari: open a chrome-less app window.
      // (iOS ignores the size features and tabs to full-screen Safari —
      //  exactly the same site, exactly the same code.)
      var w = window.open(APP_TARGET, "_blank",
                          "popup=yes,width=1100,height=800,menubar=no,toolbar=no,location=no,status=no");
      return !!w;
    }
    // Launch instantly (before paint) so the user never sees an empty tab.
    try {
      if (!isStandalone()) openAppWindow();
    } catch (e) { /* fall through to the manual button below */ }
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Dairy Writing ✍️ | Open App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9C%8D%EF%B8%8F%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="style.css" />
  <style>
    /* Minimal launcher-only styling. The journal itself is rendered by
       index.html with its own unchanged styles. */
    .app-launcher {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: "Poppins", sans-serif;
    }
    .app-launcher-card {
      text-align: center;
      max-width: 420px;
      width: 100%;
      padding: 40px 28px;
      border-radius: 20px;
      background: var(--card-bg, #fffdf7);
      box-shadow: 0 12px 40px rgba(60, 47, 30, .14);
    }
    .app-launcher-emoji { font-size: 3rem; line-height: 1; margin-bottom: 12px; }
    .app-launcher-title {
      font-family: "Playfair Display", serif;
      font-size: 1.6rem;
      color: #b3456b;
      margin: 0 0 8px;
    }
    .app-launcher-sub { color: #6b5a45; font-size: .95rem; margin: 0 0 22px; }
    .app-launcher-btn {
      display: inline-block;
      width: 100%;
      font-size: 1.05rem;
      cursor: pointer;
    }
    .app-launcher-note { margin-top: 16px; font-size: .82rem; color: #8a7a66; }
    .app-launcher-fallback .app-launcher { display: flex; }
  </style>
</head>
<body class="app-launcher-fallback">

  <!-- ===== Launcher card (only visible if the auto-open was blocked) ===== -->
  <main class="app-launcher" id="launcher">
    <div class="app-launcher-card">
      <div class="app-launcher-emoji">🥛✍️</div>
      <h1 class="app-launcher-title">Dairy Writing — App</h1>
      <p class="app-launcher-sub">Your daily journal, opened in its own app window.
         Same version as the website — on every device.</p>
      <button class="btn btn-primary btn-block app-launcher-btn" id="openAppBtn" type="button">
        📖 Open the App
      </button>
      <p class="app-launcher-note">Didn’t open automatically? Tap above, or allow pop-ups for this page.</p>
    </div>
  </main>

  <script>
    (function () {
      "use strict";

      function hideLauncher() {
        var l = document.getElementById("launcher");
        if (l) l.style.display = "none";
      }

      // If we're already inside the standalone app frame, hand over to the
      // real application immediately (same current code, same URL).
      if (isStandalone()) { location.replace(APP_TARGET); return; }

      document.addEventListener("DOMContentLoaded", function () {
        var btn = document.getElementById("openAppBtn");
        btn.addEventListener("click", function () {
          if (openAppWindow()) hideLauncher();
        });
      });
    })();
  </script>
</body>
</html>
